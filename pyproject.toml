[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rare26-nct-tso"
version = "0.1.0"
description = "Reproducible RARE26 ResNet50 linear and C4-head training pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]

